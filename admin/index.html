<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>海大易物 · 网页管理后台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ================= 登录页 ================= -->
  <div class="login-wrap" id="login-view">
    <form class="login-card" id="login-form" autocomplete="off">
      <div class="login-brand">
        <span class="brand-mark">海</span>
        <div>
          <h1>海大易物 · 管理后台</h1>
          <p class="login-sub">课程演示用的管理员账号，数据来自本机 server/</p>
        </div>
      </div>

      <label class="field">
        <span class="field-label">管理员 ID</span>
        <input id="login-id" class="field-input" type="text" value="haidayiwu2026" />
      </label>

      <label class="field">
        <span class="field-label">管理员姓名<span class="req">*</span></span>
        <input id="login-name" class="field-input" type="text" placeholder="例如：学生会 · 张老师" />
      </label>

      <div class="field-error" id="login-error"></div>

      <button class="btn btn-primary btn-block" type="submit">登录</button>
      <p class="login-note">姓名只用于记录「谁处理了这条举报」，不做密码校验。</p>
    </form>
  </div>

  <!-- ================= 后台主体 ================= -->
  <div class="app" id="app-view" hidden>
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-mark small">海</span>
        <span class="topbar-title">海大易物 · 管理后台</span>
      </div>
      <div class="topbar-right">
        <span class="admin-name" id="topbar-name"></span>
        <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">退出登录</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab is-active" data-tab="stats" type="button">数据概览</button>
      <button class="tab" data-tab="reports" type="button">举报处理</button>
      <button class="tab" data-tab="comments" type="button">评论管理</button>
      <button class="tab" data-tab="ratings" type="button">评价管理</button>
      <button class="tab" data-tab="items" type="button">商品管理</button>
    </nav>

    <main class="main">
      <section class="panel" data-panel="stats">
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">数据概览</h2>
            <button class="btn btn-ghost btn-sm" data-refresh="stats" type="button">刷新</button>
          </div>
          <div class="stat-grid" id="stat-grid"></div>
        </div>
      </section>

      <section class="panel" data-panel="reports" hidden>
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">举报处理</h2>
            <button class="btn btn-ghost btn-sm" data-refresh="reports" type="button">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>商品标题</th>
                  <th>举报人</th>
                  <th>原因</th>
                  <th>时间</th>
                  <th>状态</th>
                  <th class="col-actions">操作</th>
                </tr>
              </thead>
              <tbody id="reports-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="panel" data-panel="comments" hidden>
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">评论管理</h2>
            <button class="btn btn-ghost btn-sm" data-refresh="comments" type="button">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>商品标题</th>
                  <th>用户名</th>
                  <th>内容</th>
                  <th>时间</th>
                  <th class="col-actions">操作</th>
                </tr>
              </thead>
              <tbody id="comments-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="panel" data-panel="ratings" hidden>
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">评价管理</h2>
            <button class="btn btn-ghost btn-sm" data-refresh="ratings" type="button">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>商品标题</th>
                  <th>评价人</th>
                  <th>被评价人</th>
                  <th>星级</th>
                  <th>内容</th>
                  <th>时间</th>
                  <th class="col-actions">操作</th>
                </tr>
              </thead>
              <tbody id="ratings-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="panel" data-panel="items" hidden>
        <div class="card">
          <div class="card-head">
            <h2 class="card-title">商品管理</h2>
            <button class="btn btn-ghost btn-sm" data-refresh="items" type="button">刷新</button>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>标题</th>
                  <th>卖家</th>
                  <th>价格</th>
                  <th>状态</th>
                  <th class="col-actions">操作</th>
                </tr>
              </thead>
              <tbody id="items-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
